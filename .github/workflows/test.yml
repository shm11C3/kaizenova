name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: behavior tests
        run: python tests/check_task_cycle.py
      - name: installer smoke test
        shell: bash
        run: |
          mkdir demo && cd demo && git init -q
          python ../install.py .
          test -e .claude/skills/execute-task-cycle/SKILL.md
          python scripts/task_cycle.py start --task demo --title demo
          test -f .kaizenova/task-cycle.json
          python scripts/task_cycle.py status
